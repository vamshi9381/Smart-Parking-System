# ==========================================
# APPLICATION
# ==========================================
spring.application.name=demo-auth-app
server.port=${PORT:8080}

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_parking}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:vamshi}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# DATABASE CONNECTION POOL
# ==========================================
spring.datasource.hikari.maximum-pool-size=5

# ==========================================
# JWT SECURITY
# ==========================================
application.jwt.secretKey=${JWT_SECRET}
application.jwt.tokenExpiration=${JWT_EXPIRATION:8640000}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.swagger-ui.path=/api/v1/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.url=/api/v1/openapi